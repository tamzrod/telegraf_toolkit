# Isolated, non-production InfluxDB test stack for Telegraf Toolkit.
#
# Scope and safety:
#   - Test-host only. Never point this at a production historian or remote host.
#   - Official upstream `influxdb` images, pinned to an exact patch tag AND an
#     immutable multi-arch index digest (pinning policy: no floating tags).
#   - Host ports bind to 127.0.0.1 only; a dedicated project/network keeps this
#     stack separate from any other Compose project.
#   - No privileged containers, no host Docker socket, no extra capabilities.
#   - Credentials are provisioned to files under ./secrets (Git-ignored) and
#     injected through Compose secrets, never as inline environment values.
#
# Verify a pin before use:
#   docker buildx imagetools inspect influxdb:2.9.1@sha256:cdd3dbde...
#   docker buildx imagetools inspect influxdb:3.12.1-core@sha256:1c8200f7...
#
# Run through the scripts in ./scripts (see README.md) rather than by hand.

name: telegraf-toolkit-influxdb-test

services:
  influxdb2:
    # InfluxDB 2 OSS v2.9.1 (latest 2.x OSS patch at time of writing).
    image: influxdb:2.9.1@sha256:cdd3dbdea45c2f43513abd06ee9644b6e05d2354a2b93ca829c9f07d716eaaac
    container_name: ttk-influxdb2
    # Run as the invoking host user so 0400 secret files stay readable by the
    # container process without relaxing their permissions.
    user: "${HOST_UID}:${HOST_GID}"
    restart: "no"
    ports:
      - "127.0.0.1:${INFLUXDB2_PORT:-18086}:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME_FILE: /run/secrets/influxdb2-admin-username
      DOCKER_INFLUXDB_INIT_PASSWORD_FILE: /run/secrets/influxdb2-admin-password
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN_FILE: /run/secrets/influxdb2-admin-token
      DOCKER_INFLUXDB_INIT_ORG: "${INFLUXDB2_ORG:-ttk-test-org}"
      DOCKER_INFLUXDB_INIT_BUCKET: "${INFLUXDB2_BUCKET:-ttk-test-bucket}"
      DOCKER_INFLUXDB_INIT_RETENTION: "${INFLUXDB2_RETENTION:-0s}"
    secrets:
      - influxdb2-admin-username
      - influxdb2-admin-password
      - influxdb2-admin-token
    volumes:
      - ./data/influxdb2:/var/lib/influxdb2
      - ./data/influxdb2-config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://localhost:8086"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    networks:
      - influxdb-test

  influxdb3:
    # InfluxDB 3 Core v3.12.1.
    image: influxdb:3.12.1-core@sha256:1c8200f75657c7586678b52570f8c78aedfa2cd42e59c238a733423aab6bd406
    container_name: ttk-influxdb3
    # InfluxDB 3 Core ships a non-root `influxdb3` user (uid 1500). We override
    # it with the invoking host user so the 0400 admin-token file and the data
    # directory are usable without loosening permissions.
    user: "${HOST_UID}:${HOST_GID}"
    environment:
      HOME: /tmp
    restart: "no"
    ports:
      - "127.0.0.1:${INFLUXDB3_PORT:-18181}:8181"
    # `--admin-token-file` provisions the admin token before the API accepts
    # requests, so the endpoint is never briefly unauthenticated.
    command:
      - influxdb3
      - serve
      - --node-id=${INFLUXDB3_NODE_ID:-ttk-test-node}
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --plugin-dir=/var/lib/influxdb3/plugins
      - --admin-token-file=/run/secrets/influxdb3-admin-token.json
    secrets:
      - influxdb3-admin-token.json
    volumes:
      - ./data/influxdb3:/var/lib/influxdb3/data
      - ./data/influxdb3-plugins:/var/lib/influxdb3/plugins
    healthcheck:
      # /health requires auth and returns 401 without a token; accept either
      # 200 (authenticated) or 401 (server up, auth enforced) as "responding".
      test:
        - CMD-SHELL
        - 'code="$$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8181/health)"; [ "$$code" = "200" ] || [ "$$code" = "401" ]'
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s
    networks:
      - influxdb-test

secrets:
  influxdb2-admin-username:
    file: ./secrets/influxdb2-admin-username
  influxdb2-admin-password:
    file: ./secrets/influxdb2-admin-password
  influxdb2-admin-token:
    file: ./secrets/influxdb2-admin-token
  influxdb3-admin-token.json:
    file: ./secrets/influxdb3-admin-token.json

networks:
  influxdb-test:
    name: telegraf-toolkit-influxdb-test
    driver: bridge
